# PosterPal self-host stack: app + worker + Postgres.
# Fill the required secrets in a local .env (see .env.example), then:
#   docker compose up -d --build
# Open http://localhost:8080 — sign in with POSTERPAL_ADMIN_EMAIL/PASSWORD.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: posterpal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: posterpal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posterpal -d posterpal"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://posterpal:${POSTGRES_PASSWORD}@db:5432/posterpal
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      POSTERPAL_MASTER_KEY: ${POSTERPAL_MASTER_KEY:?set POSTERPAL_MASTER_KEY in .env}
      POSTERPAL_ADMIN_EMAIL: ${POSTERPAL_ADMIN_EMAIL:?set POSTERPAL_ADMIN_EMAIL in .env}
      POSTERPAL_ADMIN_PASSWORD: ${POSTERPAL_ADMIN_PASSWORD:?set POSTERPAL_ADMIN_PASSWORD in .env}
      XAI_API_KEY: ${XAI_API_KEY:-}
      # Public URL for OAuth redirects when behind a reverse proxy.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health | grep -q '\"db\":\"up\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build: .
    restart: unless-stopped
    command: ["sh", "-c", "npx tsx scripts/worker.ts"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://posterpal:${POSTGRES_PASSWORD}@db:5432/posterpal
      POSTERPAL_MASTER_KEY: ${POSTERPAL_MASTER_KEY:?set POSTERPAL_MASTER_KEY in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      POSTERPAL_WORKER_INTERVAL_MS: ${POSTERPAL_WORKER_INTERVAL_MS:-60000}
      XAI_API_KEY: ${XAI_API_KEY:-}
    # The worker keeps the desk alive when no browser tab is open: fires due
    # LocalScheduled posts, syncs Graph, refreshes vault tokens.

volumes:
  pgdata:
